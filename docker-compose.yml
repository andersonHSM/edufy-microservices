version: '3.8'

services:
  # PostgreSQL para Auth API
  auth-db:
    image: postgres:17-alpine
    container_name: edufy-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5434:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./docker/init-scripts/auth-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_db" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL para Users API
  users-db:
    image: postgres:17-alpine
    container_name: edufy-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_password
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
      - ./docker/init-scripts/users-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U users_user -d users_db" ]
      interval: 30s
      timeout: 10s
      retries: 3

  courses-db:
    image: postgres:17-alpine
    container_name: edufy-courses-db
    environment:
      POSTGRES_DB: courses_db
      POSTGRES_USER: courses_user
      POSTGRES_PASSWORD: courses_password
    ports:
      - "5435:5432"
    volumes:
      - courses_db_data:/var/lib/postgresql/data
      - ./docker/init-scripts/courses-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U courses_user -d courses_db" ]
      interval: 30s
      timeout: 10s
      retries: 3

  enrollments-db:
    image: postgres:17-alpine
    container_name: edufy-enrollments-db
    environment:
      POSTGRES_DB: enrollments_db
      POSTGRES_USER: enrollments_user
      POSTGRES_PASSWORD: enrollments_password
    ports:
      - "5436:5432"
    volumes:
      - enrollments_db_data:/var/lib/postgresql/data
      - ./docker/init-scripts/enrollments-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U enrollments_user -d enrollments_db" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL para Support API
  support-db:
    image: postgres:17-alpine
    container_name: edufy-support-db
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
    ports:
      - "5437:5432"
    volumes:
      - support_db_data:/var/lib/postgresql/data
      - ./docker/init-scripts/support-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U support_user -d support_db" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: edufy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - edufy-network
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
  
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: edufy-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq
      - ./docker/rabbitmq/definitions.json:/opt/rabbitmq/definitions.json:ro
    networks:
      - edufy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin para administração dos bancos
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edufy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edufy.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - edufy-network
    restart: unless-stopped
    depends_on:
      - auth-db
      - users-db
      - courses-db
      - enrollments-db
      - support-db

  # Application Services
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: edufy-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - AUTH_SERVICE_HOST=auth-api
      - AUTH_SERVICE_PORT=3001
      - USERS_SERVICE_HOST=users-api
      - USERS_SERVICE_PORT=3002
      - COURSES_SERVICE_HOST=courses-api
      - COURSES_SERVICE_PORT=3003
      - ENROLLMENTS_SERVICE_HOST=enrollments-api
      - ENROLLMENTS_SERVICE_PORT=3004
      - SUPPORT_SERVICE_HOST=support-api
      - SUPPORT_SERVICE_PORT=3005
    networks:
      - edufy-network
    depends_on:
      - rabbitmq
      - auth-api
      - users-api
      - courses-api
      - enrollments-api
      - support-api

  auth-api:
    build:
      context: .
      dockerfile: apps/auth-api/Dockerfile
    container_name: edufy-auth-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://auth_user:auth_password@auth-db:5432/auth_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "pnpm run migrate && node dist/main"
    networks:
      - edufy-network
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  users-api:
    build:
      context: .
      dockerfile: apps/users-api/Dockerfile
    container_name: edufy-users-api
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://users_user:users_password@users-db:5432/users_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "pnpm run migrate && node dist/main"
    networks:
      - edufy-network
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  courses-api:
    build:
      context: .
      dockerfile: apps/courses-api/Dockerfile
    container_name: edufy-courses-api
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://courses_user:courses_password@courses-db:5432/courses_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "pnpm run migrate && node dist/main"
    networks:
      - edufy-network
    depends_on:
      courses-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  enrollments-api:
    build:
      context: .
      dockerfile: apps/enrollments-api/Dockerfile
    container_name: edufy-enrollments-api
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://enrollments_user:enrollments_password@enrollments-db:5432/enrollments_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "pnpm run migrate && node dist/main"
    networks:
      - edufy-network
    depends_on:
      enrollments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  support-api:
    build:
      context: .
      dockerfile: apps/support-api/Dockerfile
    container_name: edufy-support-api
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://support_user:support_password@support-db:5432/support_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "pnpm run migrate && node dist/main"
    networks:
      - edufy-network
    depends_on:
      support-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  auth_db_data:
    driver: local
  users_db_data:
    driver: local
  courses_db_data:
    driver: local
  enrollments_db_data:
    driver: local
  support_db_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_log:
    driver: local

networks:
  edufy-network: