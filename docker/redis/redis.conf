# Configuração do Redis para Edufy Microservices

# Configurações básicas
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Configurações de memória
maxmemory 256mb
maxmemory-policy allkeys-lru

# Configurações de persistência
save 900 1
save 300 10
save 60 10000

# Configurações de log
loglevel notice
logfile ""

# Configurações de segurança (descomente para produção)
# requirepass your_redis_password

# Configurações de performance
hz 10
databases 16

# Configuração para desenvolvimento (remova em produção)
protected-mode no

# Configurações de cliente
tcp-backlog 511
